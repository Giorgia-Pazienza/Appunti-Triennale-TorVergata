<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Esempio_Pagina_Web_Turistica</title>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
  <style>

    /* STILE E SFONDO PAGINA */
    html, body {
      width: 100%;
      height: 100%;
      margin-top: 0;
      margin-left: 0;
      font-family: Arial, sans-serif;
    }
    #sfondo{
        background-size: cover;
        width: 100%;
        opacity: 0.6;
        background-attachment: fixed;
        display: flex;
        margin: 0;
    }
    #sfondo {
      position: fixed;
      top: 0;
      left: 0;
      z-index: -1;
    }

    /* BARRA DI NAVIGAZIONE */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #800020;
      opacity: 0.9;
      padding: 10px 20px;
    }
    .navbar-brand {
      font-size: 24px;
      font-weight: bold;
      text-decoration: none;
      color: white;
    }
    .navbar-menu {
      display: flex;
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .navbar-menu li {
      position: relative;
    }
    .navbar-menu a {
      display: block;
      padding: 10px 15px;
      text-decoration: none;
      color: white;
      font-family: "Times New Roman", Times, serif;
      font-weight: bold;
    }
    .navbar-menu a:hover {
      background-color: #a52a2a;
    }
    .cascata {
      display: none;
      position: absolute;
      background-color: white;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      min-width: 160px;
      z-index: 1;
    }
    .cascata a {
      color: #800020;
      padding: 10px;
      display: block;
    }
    .navbar-menu li:hover .cascata {
      display: block;
    }
    .menu-toggle {
      display: none;
      font-size: 28px;
      cursor: pointer;
      color: white;
    }

    /* BOTTONE CHATBOT */
    #Bottone {
      background-color: #800020;
      color: white;
      font-family: "Times New Roman", Times, serif;
      font-weight: bold;
      border: none;
      padding: 10px 20px;
      position: fixed;
      top: 85%;
      right: 80px;
      cursor: pointer;
      z-index: 1000;
    }
    #Bottone:hover {
      background-color: #a52a2a;
    }

    /* ADATTAMENTO VIEWPORT */
    @media (max-width: 768px) {
      .navbar-menu {
        flex-direction: column;
        width: 100%;
        display: none;
        background-color: #800020;
      }
      .navbar-menu.active {
        display: flex;
      }
      .menu-toggle {
        display: block;
      }
    }

    /* CONTENITORE PRINCIPALE (SFONDO TELEFONO) */
    .chat-container {
      position: fixed;
      right: 15px;
      top: 80px;
      width: 300px;
      height: 600px;
      border-radius: 40px;
      background: white;
      display: none; 
      flex-direction: column;
      z-index: 999;
    }

    /* CORNICE CONTENITORE (TELEFONO) */
    .background-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* CONTENUTO CHAT */
    .chat-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 15px;
    }

    /* ICONA CHAT */
    .Full_Icone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      margin-top: 5px;
    }
    #cerchio1 {
      width: 70px;
      height: 70px;
      background: #800020;
      border-radius: 50%;
      position: relative;
      top: 20px;
    }
    #cerchio2 {
      width: 55px;
      height: 55px;
      background: white;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5px;
      box-sizing: border-box;
    }
    #nome {
      font-family: Georgia, 'Times New Roman', Times, serif;
      font-size: 7px;
      font-weight: bold;
      color: black;
      margin-bottom: 2px;
      text-align: center;
    }
    #icona {
      width: 30px;
      height: 30px;
      object-fit: cover;
      border-radius: 50%;
    }

    /* AREA CHAT */
    .chat-box {
      width: 220px;
      height: 300px;
      flex: 1;
      overflow-y: auto;
      border: 1px solid #ddd;
      padding: 10px;
      margin: 15px auto 10px auto;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /* AREA INPUT DOVE L'UTENTE SCRIVE MESSAGGI */
    .input-area {
      display: flex;
      width: 90%;
      margin: 0 auto 20px auto;
    }
    .input-area input {
      flex: 1;
      padding: 5px 10px;
      border: 1px solid #ccc;
      border-radius: 10px 0 0 10px;
      font-size: 14px;
    }
    .input-area button {
      padding: 0 15px;
      border: none;
      background-color: #800020;
      color: white;
      border-radius: 0 10px 10px 0;
      cursor: pointer;
      font-size: 14px;
    }
    .input-area button:hover {
      background-color: #a00028;
    }

    /* MESSAGGI */
    .message {
      padding: 8px 12px;
      border-radius: 15px;
      max-width: 80%;
      word-wrap: break-word;
    }

    /* MESSAGGI UTENTE*/
    .user {
      align-self: flex-end;
      background-color: #800020;
      opacity: 0.8;
      color: white;
    }

    /* MESSAGGI BOT*/
    .bot {
      align-self: flex-start;
      background-color: #ececec;
      color: black;
    }

    /* ADATTAMENTO IMMAGINE DI SFONDO PER SCHERMI PICCOLI */
    @media (max-width: 768px) {
      #sfondo {
        background-size: cover !important;
        background-position: center !important; 
        background-attachment: scroll !important; 
        min-height: 100vh !important;
      }
    }
  </style>
</head>
<body>

  <!-- STRUTTURA PAGINA WEB SOTTOSTANTE -->
  <div>

    <!-- IMMAGINE DI SFONDO -->
    <img src="Paesaggio.jpg" alt="Sfondo" id="sfondo">

      <!-- BARRA DI NAVIGAZIONE -->
    <nav class="navbar">
      <a class="navbar-brand" href="index.html"></a>
      <span class="menu-toggle" onclick="toggleMenu()" aria-label="Apri menu di navigazione">☰</span>
      <ul class="navbar-menu" id="navMenu">
        <li><a href="index.html">Home</a></li>
        <li>
          <a href="#">Villages ▾</a>
          <ul class="cascata">
            <li><a href="Giuliano.html">Castel Giuliano</a></li>
            <li><a href="Viterbo.html">Viterbo</a></li>
            <li><a href="Bagnoregio.html">Bagnoregio</a></li>
            <li><a href="GrotteDiCastro.html">Grotte di Castro</a></li>
          </ul>
        </li>
        <li><a href="Itinerario.html">Itinerary</a></li>
        <li><a href="Staff.html">Our team</a></li>
        <li><a href="feedback.html">Feedback</a></li>
      </ul>
    </nav>
  </div>

  <!-- STRUTTURA CHATBOT -->
  <main>
    <!-- PULSANTE PER APRIRE LA CHAT -->
    <button id="Bottone" onclick="toggleChat()">CHAT BOT</button>

    <!-- CHAT INTEGRATA -->
    <div class="chat-container" id="chatContainer">
      <img src="Telefono.png" alt="Telefono" class="background-image">
      <div class="chat-content">
        <div class="Full_Icone">
          <div id="cerchio1">
            <div id="cerchio2">
              <div id="nome">ChatBot</div>
              <img id="icona" src="Icona.png" alt="Icona">
            </div>
          </div>
        </div>
        <div class="chat-box" id="chat-box"></div>
        <div class="input-area">
          <input type="text" id="messaggi-input" placeholder="Digita la tua domanda..." />
          <button onclick="sendMessage()">Invia</button>
        </div>
      </div>
    </div>
  </main>

</body>

<!-- PARTE DINAMICA CHATBOT -->
<script>
  let fuse;
  let datiChatbot = [];

  // Caricamento delle FAQ e inizializzazione di Fuse.js
  fetch('FAQ.json')
    .then(response => response.json())
    .then(data => {
      datiChatbot = data;
      fuse = new Fuse(data, {
        keys: ['domanda'],
        threshold: 0.4,
        includeScore: true
      });
    });

  // Mostra la chat e nasconde il bottone
  function toggleChat() {
    const container = document.getElementById('chatContainer');
    const bottone = document.getElementById('Bottone');

    container.style.display = 'flex';
    bottone.style.display = 'none';
  }

  // Alterna visibilità del menu (es. nav hamburger)
  function toggleMenu() {
    document.getElementById("navMenu").classList.toggle("active");
  }

  // Invio del messaggio utente e risposta del bot
  function sendMessage() {
    const input = document.getElementById('messaggi-input');
    const chatBox = document.getElementById('chat-box');
    const messaggio = input.value.trim();
    if (!messaggio) return;

    // Mostra il messaggio dell'utente
    aggiungiMessaggio(messaggio, 'user');

    // Cerca la risposta migliore
    const risultati = fuse.search(messaggio);

    if (risultati.length > 0) {
      const punteggioTop = risultati[0].score;

      if (punteggioTop < 0.2) {
        aggiungiMessaggio(risultati[0].item.risposta, 'bot');
      } else {
        const suggerimenti = risultati.slice(0, 3).map(r => `• ${r.item.domanda}`).join('<br>');
        aggiungiMessaggio("Non ho capito bene. Forse cercavi:<br>" + suggerimenti, 'bot');
      }
    } else {
      aggiungiMessaggio("Mi dispiace, non ho trovato nulla. Prova a riformulare la domanda.", 'bot');
    }

    input.value = '';
  }

  // Aggiunge un messaggio nella chat
  function aggiungiMessaggio(testo, tipo) {
    const chatBox = document.getElementById('chat-box');
    const div = document.createElement('div');
    div.className = `message ${tipo}`;
    div.innerHTML = testo;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }
</script>

</html>
